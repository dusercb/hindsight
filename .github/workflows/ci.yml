# Backtester CI (PORTING_TO_LIVE.md Stage 0): the full pytest suite + a
# minimal-ruleset ruff pass (syntax errors / undefined names only -- the
# codebase predates ruff, so style rules would drown the signal) on every
# push/PR to main. The suite is fully offline (IBKR interactions are faked in
# tests), so no market data or TWS is needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ibkr_premarket_backtester
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ibkr_premarket_backtester/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Ruff (syntax / undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Pytest (full suite)
        run: python -m pytest -q
